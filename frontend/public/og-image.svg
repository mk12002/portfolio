<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <!-- Source for og-image.png. Export at 1200x630 to refresh the social card. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1b2740" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <circle cx="1050" cy="120" r="220" fill="#10b981" opacity="0.06"/>

  <!-- accent bar -->
  <rect x="82" y="150" width="72" height="10" rx="5" fill="url(#accent)"/>

  <text x="82" y="222" fill="#10b981" font-size="40" font-weight="800" letter-spacing="3">CYBERSECURITY  ×  AI ENGINEER</text>
  <text x="80" y="330" fill="#f8fafc" font-size="104" font-weight="800" letter-spacing="-2">Mohit Kumar</text>
  <text x="84" y="392" fill="#94a3b8" font-size="34" font-weight="400">Securing systems with AI. Securing AI from attack.</text>

  <!-- chips -->
  <g font-size="26" font-weight="700">
    <g>
      <rect x="84" y="440" width="330" height="56" rx="28" fill="none" stroke="#10b981" stroke-width="2"/>
      <text x="249" y="477" fill="#d1fae5" text-anchor="middle">5 open-source scanners</text>
    </g>
    <g>
      <rect x="430" y="440" width="196" height="56" rx="28" fill="none" stroke="#10b981" stroke-width="2"/>
      <text x="528" y="477" fill="#d1fae5" text-anchor="middle">1,350+ tests</text>
    </g>
    <g>
      <rect x="642" y="440" width="176" height="56" rx="28" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="730" y="477" fill="#d1fae5" text-anchor="middle">VAPT · SOC</text>
    </g>
    <g>
      <rect x="834" y="440" width="238" height="56" rx="28" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="953" y="477" fill="#d1fae5" text-anchor="middle">Adversarial ML</text>
    </g>
  </g>

  <text x="84" y="572" fill="#64748b" font-size="26" font-weight="500">mohitkumar-mu.vercel.app</text>
</svg>
