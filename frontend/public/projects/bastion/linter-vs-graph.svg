<svg viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="lvg-title" xmlns="http://www.w3.org/2000/svg"><title id="lvg-title">A per-resource linter reports disconnected findings; Bastion reports one explained path to cluster-admin</title><style>.h{font:700 20px -apple-system,"Segoe UI",Roboto,sans-serif}.sub{font:400 13px -apple-system,"Segoe UI",Roboto,sans-serif;fill:#8a93a3}.lint{font:600 12px ui-monospace,Menlo,Consolas,monospace;fill:#5a6478}.node{font:600 12.5px -apple-system,"Segoe UI",Roboto,sans-serif}.kind{font:600 9.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}.edge{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:#5a6478}.foot{font:600 13px -apple-system,"Segoe UI",Roboto,sans-serif}</style><rect width="960" height="470" rx="0" fill="#ffffff"/><line x1="480" y1="60" x2="480" y2="440" stroke="#e6e9ef" stroke-width="1.5"/><text x="40" y="42" class="h" fill="#c07a20">A per-resource linter</text><text x="40" y="62" class="sub">sees a pile of findings, one box at a time</text><rect x="40" y="81" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="99" class="lint">[WARN] Role has a wildcard verb</text><rect x="40" y="117" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="135" class="lint">[WARN] SA token is auto-mounted</text><rect x="40" y="153" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="171" class="lint">[WARN] no NetworkPolicy</text><rect x="40" y="189" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="207" class="lint">[WARN] can create pods</text><rect x="40" y="225" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="243" class="lint">[WARN] can exec into pods</text><rect x="40" y="261" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="279" class="lint">[WARN] can create bindings</text><rect x="40" y="297" width="360" height="26" rx="6" fill="#fbf6ee" stroke="#e7d9c0" stroke-width="1"/><text x="54" y="315" class="lint">[WARN] no resource limits</text><text x="40" y="362" class="foot" fill="#c07a20">7 findings. None of them connected.</text><text x="520" y="42" class="h" fill="#2f5fbf">Bastion</text><text x="520" y="62" class="sub">sees one path, and explains every step</text><rect x="520" y="88" width="360" height="40" rx="8" fill="#e8effb" stroke="#2f5fbf" stroke-width="1.5"/><text x="534" y="104" class="kind" fill="#2f5fbf">SERVICEACCOUNT</text><text x="534" y="120" class="node" fill="#1d3f80">ci-runner</text><line x1="550" y1="128" x2="550" y2="154" stroke="#8a93a3" stroke-width="1.6"/><polygon points="546,148 554,148 550,154" fill="#8a93a3"/><text x="564" y="149" class="edge">CAN_CREATE</text><rect x="520" y="154" width="360" height="40" rx="8" fill="#e8effb" stroke="#2f5fbf" stroke-width="1.5"/><text x="534" y="170" class="kind" fill="#2f5fbf">SERVICEACCOUNT</text><text x="534" y="186" class="node" fill="#1d3f80">debugger</text><line x1="550" y1="194" x2="550" y2="220" stroke="#8a93a3" stroke-width="1.6"/><polygon points="546,214 554,214 550,220" fill="#8a93a3"/><text x="564" y="215" class="edge">CAN_EXEC</text><rect x="520" y="220" width="360" height="40" rx="8" fill="#eaf4ec" stroke="#3f8f57" stroke-width="1.5"/><text x="534" y="236" class="kind" fill="#3f8f57">DEPLOYMENT</text><text x="534" y="252" class="node" fill="#255c36">controller</text><line x1="550" y1="260" x2="550" y2="286" stroke="#8a93a3" stroke-width="1.6"/><polygon points="546,280 554,280 550,286" fill="#8a93a3"/><text x="564" y="281" class="edge">RUNS_AS</text><rect x="520" y="286" width="360" height="40" rx="8" fill="#e8effb" stroke="#2f5fbf" stroke-width="1.5"/><text x="534" y="302" class="kind" fill="#2f5fbf">SERVICEACCOUNT</text><text x="534" y="318" class="node" fill="#1d3f80">controller-sa</text><line x1="550" y1="326" x2="550" y2="352" stroke="#8a93a3" stroke-width="1.6"/><polygon points="546,346 554,346 550,352" fill="#8a93a3"/><text x="564" y="347" class="edge">CAN_BIND</text><rect x="520" y="352" width="360" height="40" rx="8" fill="#f6e6f6" stroke="#9b3f9b" stroke-width="1.5"/><text x="534" y="368" class="kind" fill="#9b3f9b">TERMINAL</text><text x="534" y="384" class="node" fill="#6d1f6d">cluster-admin</text></svg>
