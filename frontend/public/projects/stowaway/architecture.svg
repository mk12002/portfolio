<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="940" height="580" fill="#f4f1ea"/>
  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2933" font-family="Georgia,serif">Stowaway scan pipeline</text>
  <text x="470" y="64" text-anchor="middle" font-size="13" fill="#616e7c">offline · static · deterministic — scanned code is never executed, no network at scan time</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8266"/>
    </marker>
  </defs>

  <!-- ===== Top row: 4-stage pipeline ===== -->
  <!-- Stage 1: Walk -->
  <rect x="40" y="100" width="180" height="180" rx="10" fill="#fff" stroke="#c9bfa8"/>
  <text x="130" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Walk project</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#616e7c">excludes vendored</text>
  <text x="130" y="190" text-anchor="middle" font-size="12" fill="#616e7c">trees, .gitignore,</text>
  <text x="130" y="210" text-anchor="middle" font-size="12" fill="#616e7c">size caps, symlink</text>
  <text x="130" y="230" text-anchor="middle" font-size="12" fill="#616e7c">confinement</text>

  <!-- Stage 2: Parsers -->
  <rect x="260" y="100" width="190" height="180" rx="10" fill="#fff" stroke="#c9bfa8"/>
  <text x="355" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Ecosystem parsers</text>
  <text x="355" y="170" text-anchor="middle" font-size="12.5" fill="#3e4c59">npm · PyPI · Go · Cargo</text>
  <text x="355" y="196" text-anchor="middle" font-size="12" fill="#616e7c">manifests · lockfiles</text>
  <text x="355" y="216" text-anchor="middle" font-size="12" fill="#616e7c">install hooks (AST/text)</text>
  <text x="355" y="248" text-anchor="middle" font-size="12.5" font-style="italic" fill="#b3541e">→ ScanContext</text>

  <!-- Stage 3: Rules -->
  <rect x="490" y="100" width="210" height="180" rx="10" fill="#fff" stroke="#c9bfa8"/>
  <text x="595" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Detection rules</text>
  <text x="506" y="166" font-size="12" fill="#3e4c59">R1  Typosquatting</text>
  <text x="506" y="190" font-size="12" fill="#3e4c59">R2  Dependency confusion</text>
  <text x="506" y="214" font-size="12" fill="#3e4c59">R3  Install behavior (B1–B7)</text>
  <text x="506" y="238" font-size="12" fill="#3e4c59">R4  Lockfile integrity</text>
  <text x="506" y="262" font-size="12" fill="#3e4c59">R5  Structural signals</text>

  <!-- Stage 4: Risk -->
  <rect x="740" y="100" width="160" height="180" rx="10" fill="#fbf3e8" stroke="#b3541e"/>
  <text x="820" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Risk model</text>
  <text x="820" y="172" text-anchor="middle" font-size="12" fill="#616e7c">combination</text>
  <text x="820" y="192" text-anchor="middle" font-size="12" fill="#616e7c">escalation +</text>
  <text x="820" y="212" text-anchor="middle" font-size="12" fill="#616e7c">corroboration</text>
  <text x="820" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b3541e">→ P0–P3 + score</text>

  <!-- horizontal arrows between top stages (mid-height y=190) -->
  <line x1="220" y1="190" x2="256" y2="190" stroke="#8a8266" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="190" x2="486" y2="190" stroke="#8a8266" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="700" y1="190" x2="736" y2="190" stroke="#8a8266" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== drop from Risk model to Emitters (single clean vertical arrow) ===== -->
  <line x1="820" y1="280" x2="820" y2="356" stroke="#8a8266" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="808" y="322" text-anchor="end" font-size="11.5" fill="#8a8266">findings + assessments</text>

  <!-- ===== Bottom-left: what every finding carries (fills the open space) ===== -->
  <text x="40" y="392" font-size="13" font-weight="600" fill="#1f2933">Every finding carries</text>
  <text x="40" y="420" font-size="12" fill="#616e7c">· severity + confidence</text>
  <text x="40" y="442" font-size="12" fill="#616e7c">· file:line evidence (traceable)</text>
  <text x="40" y="464" font-size="12" fill="#616e7c">· concrete remediation</text>

  <!-- ===== Bottom-right: Emitters ===== -->
  <rect x="640" y="356" width="260" height="130" rx="10" fill="#fff" stroke="#c9bfa8"/>
  <text x="770" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Emitters (deterministic)</text>
  <rect x="662" y="410" width="70" height="46" rx="6" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="697" y="438" text-anchor="middle" font-size="13" fill="#2d6a4f">JSON</text>
  <rect x="745" y="410" width="70" height="46" rx="6" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="780" y="438" text-anchor="middle" font-size="13" fill="#2d6a4f">HTML</text>
  <rect x="828" y="410" width="50" height="46" rx="6" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="853" y="438" text-anchor="middle" font-size="12" fill="#2d6a4f">SARIF</text>

  <!-- ===== Footer ===== -->
  <line x1="40" y1="522" x2="900" y2="522" stroke="#d8cfba" stroke-width="1"/>
  <text x="470" y="550" text-anchor="middle" font-size="12" fill="#616e7c">--fail-on P0..P3 gates CI  ·  --baseline suppresses accepted findings  ·  fingerprints dedup findings across runs</text>
</svg>
