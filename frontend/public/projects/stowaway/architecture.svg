<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <rect width="880" height="470" fill="#f4f1ea"/>
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">Stowaway scan pipeline</text>
  <text x="440" y="54" text-anchor="middle" font-size="12" fill="#616e7c">offline · static · deterministic — scanned code is never executed, no network at scan time</text>

  <!-- Stage 1: discover -->
  <rect x="30" y="90" width="150" height="80" rx="8" fill="#fff" stroke="#c9bfa8"/>
  <text x="105" y="118" text-anchor="middle" font-weight="600" fill="#1f2933">Walk project</text>
  <text x="105" y="138" text-anchor="middle" font-size="11" fill="#616e7c">excludes vendored trees,</text>
  <text x="105" y="153" text-anchor="middle" font-size="11" fill="#616e7c">.gitignore, size caps</text>

  <!-- Stage 2: parse -->
  <rect x="230" y="70" width="180" height="120" rx="8" fill="#fff" stroke="#c9bfa8"/>
  <text x="320" y="94" text-anchor="middle" font-weight="600" fill="#1f2933">Ecosystem parsers</text>
  <text x="320" y="116" text-anchor="middle" font-size="11" fill="#3e4c59">npm · PyPI · Go · Cargo</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#616e7c">manifests, lockfiles,</text>
  <text x="320" y="153" text-anchor="middle" font-size="11" fill="#616e7c">install hooks (AST/text)</text>
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#b3541e" font-style="italic">→ ScanContext</text>

  <!-- Stage 3: rules -->
  <rect x="460" y="60" width="200" height="220" rx="8" fill="#fff" stroke="#c9bfa8"/>
  <text x="560" y="84" text-anchor="middle" font-weight="600" fill="#1f2933">Detection rules</text>
  <text x="475" y="112" font-size="11.5" fill="#3e4c59">R1  Typosquatting</text>
  <text x="475" y="134" font-size="11.5" fill="#3e4c59">R2  Dependency confusion</text>
  <text x="475" y="156" font-size="11.5" fill="#3e4c59">R3  Install behavior (B1–B7)</text>
  <text x="475" y="178" font-size="11.5" fill="#3e4c59">R4  Lockfile integrity</text>
  <text x="475" y="200" font-size="11.5" fill="#3e4c59">R5  Structural signals</text>
  <line x1="475" y1="216" x2="645" y2="216" stroke="#e0d9c7"/>
  <text x="560" y="238" text-anchor="middle" font-size="11" fill="#616e7c">every finding carries</text>
  <text x="560" y="253" text-anchor="middle" font-size="11" fill="#616e7c">severity + confidence +</text>
  <text x="560" y="268" text-anchor="middle" font-size="11" fill="#616e7c">file:line evidence</text>

  <!-- Stage 4: risk -->
  <rect x="710" y="90" width="140" height="120" rx="8" fill="#fbf3e8" stroke="#b3541e"/>
  <text x="780" y="114" text-anchor="middle" font-weight="600" fill="#1f2933">Risk model</text>
  <text x="780" y="136" text-anchor="middle" font-size="11" fill="#616e7c">combination</text>
  <text x="780" y="151" text-anchor="middle" font-size="11" fill="#616e7c">escalation +</text>
  <text x="780" y="166" text-anchor="middle" font-size="11" fill="#616e7c">corroboration</text>
  <text x="780" y="188" text-anchor="middle" font-size="11.5" fill="#b3541e" font-weight="600">→ P0–P3, score</text>

  <!-- Stage 5: emitters -->
  <rect x="290" y="340" width="300" height="90" rx="8" fill="#fff" stroke="#c9bfa8"/>
  <text x="440" y="366" text-anchor="middle" font-weight="600" fill="#1f2933">Emitters (deterministic)</text>
  <rect x="310" y="382" width="80" height="34" rx="5" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="350" y="404" text-anchor="middle" font-size="12" fill="#2d6a4f">JSON</text>
  <rect x="400" y="382" width="80" height="34" rx="5" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="440" y="404" text-anchor="middle" font-size="12" fill="#2d6a4f">HTML</text>
  <rect x="490" y="382" width="80" height="34" rx="5" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="530" y="404" text-anchor="middle" font-size="12" fill="#2d6a4f">SARIF</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8266"/>
    </marker>
  </defs>
  <line x1="180" y1="130" x2="226" y2="130" stroke="#8a8266" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="410" y1="130" x2="456" y2="130" stroke="#8a8266" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="660" y1="150" x2="706" y2="150" stroke="#8a8266" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="780" y1="210" x2="780" y2="320" stroke="#8a8266" stroke-width="1.6"/>
  <line x1="780" y1="320" x2="592" y2="376" stroke="#8a8266" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="560" y1="280" x2="480" y2="338" stroke="#8a8266" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="705" y="300" font-size="10.5" fill="#8a8266">findings + assessments</text>

  <text x="440" y="456" text-anchor="middle" font-size="11.5" fill="#616e7c">--fail-on P0..P3 gates CI · --baseline suppresses accepted findings · fingerprints dedup across runs</text>
</svg>
